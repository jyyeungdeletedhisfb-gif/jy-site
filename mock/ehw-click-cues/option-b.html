<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Click cue B — Soft outline + lift</title>
<link rel="stylesheet" href="base.css" />
<style>
  .hotspot {
    border: 1px dashed rgba(53, 99, 101, 0.32);
    border-radius: 6px;
    background: rgba(53, 99, 101, 0.04);
    box-shadow: inset 0 0 0 0 transparent;
    transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }
  .hotspot:hover,
  .hotspot:focus-visible {
    outline: none;
    border-style: solid;
    border-color: rgba(53, 99, 101, 0.72);
    background: rgba(53, 99, 101, 0.12);
    box-shadow: 0 0 0 1px rgba(232, 202, 54, 0.55), inset 0 0 24px rgba(53, 99, 101, 0.08);
    filter: brightness(1.04);
  }
  @media (prefers-reduced-motion: reduce) {
    .hotspot { transition: none; }
  }
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="index.html">← Chooser</a>
    <span class="tag">Option B · Soft outline + lift</span>
  </div>
  <main>
    <div class="stage" id="stage">
      <picture>
        <source type="image/webp" srcset="assets/ehw-cover-4x5.webp" />
        <img class="cover" src="assets/ehw-cover-4x5.jpg" width="1080" height="1350" alt="everything he wanted cover art" decoding="async" />
      </picture>
      <div class="oval-mask" aria-hidden="true"></div>
      <button type="button" class="hotspot hs-dang" data-label="Dang" aria-label="Open Dang"></button>
      <button type="button" class="hotspot hs-mas" data-label="MAS" aria-label="Open Main Antagonist Syndrome"></button>
      <button type="button" class="hotspot hs-ehw" data-label="EHW" aria-label="Open everything he wanted"></button>
      <button type="button" class="hotspot hs-title" data-label="Title" aria-label="Open art description"></button>
    </div>
  </main>
  <p class="hint">Idle dashed outline ~32% · hover solid + tint lift</p>
  <div class="flash" id="flash" aria-hidden="true"><span id="flash-label">opened</span></div>
  <script>
    const flash = document.getElementById('flash');
    const label = document.getElementById('flash-label');
    let t;
    document.querySelectorAll('.hotspot').forEach(btn => {
      btn.addEventListener('click', () => {
        label.textContent = btn.dataset.label + ' · stub';
        flash.classList.add('on');
        clearTimeout(t);
        t = setTimeout(() => flash.classList.remove('on'), 700);
      });
    });
  </script>
</body>
</html>
