<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Click cue C — Pulse ring</title>
<link rel="stylesheet" href="base.css" />
<style>
  .hotspot {
    border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(53, 99, 101, 0.4);
    transition: box-shadow 0.2s ease, background 0.2s ease;
    animation: cue-breathe 4.2s ease-in-out infinite;
  }
  @keyframes cue-breathe {
    0%, 100% {
      box-shadow:
        0 0 0 1px rgba(53, 99, 101, 0.38),
        0 0 0 0 rgba(53, 99, 101, 0);
    }
    50% {
      box-shadow:
        0 0 0 1.5px rgba(53, 99, 101, 0.62),
        0 0 10px 2px rgba(53, 99, 101, 0.18);
    }
  }
  .hotspot:hover,
  .hotspot:focus-visible {
    outline: none;
    animation: none;
    background: rgba(53, 99, 101, 0.1);
    box-shadow:
      0 0 0 2px rgba(53, 99, 101, 0.85),
      0 0 12px 2px rgba(53, 99, 101, 0.22);
  }
  @media (prefers-reduced-motion: reduce) {
    .hotspot {
      animation: none;
      box-shadow: 0 0 0 1px rgba(53, 99, 101, 0.5);
      transition: none;
    }
  }
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="index.html">← Chooser</a>
    <span class="tag">Option C · Pulse ring (restrained)</span>
  </div>
  <main>
    <div class="stage" id="stage">
      <picture>
        <source type="image/webp" srcset="assets/ehw-cover-4x5.webp" />
        <img class="cover" src="assets/ehw-cover-4x5.jpg" width="1080" height="1350" alt="everything he wanted cover art" decoding="async" />
      </picture>
      <div class="oval-mask" aria-hidden="true"></div>
      <button type="button" class="hotspot hs-dang" data-label="Dang" aria-label="Open Dang"></button>
      <button type="button" class="hotspot hs-mas" data-label="MAS" aria-label="Open Main Antagonist Syndrome"></button>
      <button type="button" class="hotspot hs-ehw" data-label="EHW" aria-label="Open everything he wanted"></button>
      <button type="button" class="hotspot hs-title" data-label="Title" aria-label="Open art description"></button>
    </div>
  </main>
  <p class="hint">Thin teal ring · one slow breath ~4s · static if reduced-motion</p>
  <div class="flash" id="flash" aria-hidden="true"><span id="flash-label">opened</span></div>
  <script>
    const flash = document.getElementById('flash');
    const label = document.getElementById('flash-label');
    let t;
    document.querySelectorAll('.hotspot').forEach(btn => {
      btn.addEventListener('click', () => {
        label.textContent = btn.dataset.label + ' · stub';
        flash.classList.add('on');
        clearTimeout(t);
        t = setTimeout(() => flash.classList.remove('on'), 700);
      });
    });
  </script>
</body>
</html>
