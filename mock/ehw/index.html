<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>everything he wanted — landing mock (v2.0 A)</title>
<link rel="stylesheet" href="../../css/chrome.css?v=ehw-mock-a1" />
<style>
  html,body{margin:0;background:#111;color:#eee;font-family:Helvetica,Arial,sans-serif}
  .bar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:5;background:linear-gradient(#111d,#1110)}
  .brand{font-family:"Geist",Helvetica,sans-serif;font-weight:900;letter-spacing:0;text-transform:uppercase;font-size:18px;color:#fff;text-decoration:none}
  .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#aaa}
  main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:72px 16px 40px;box-sizing:border-box}
  .stage{position:relative;width:min(88vh,92vw,760px);aspect-ratio:1/1}
  .cover{position:absolute;inset:0;background:
      repeating-linear-gradient(45deg,#2a2a2a 0 14px,#262626 14px 28px);
      border:1px dashed #555;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;box-sizing:border-box}
  .cover span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#888}
  .spot{position:absolute;width:26%;aspect-ratio:3/4;display:block;text-decoration:none;color:#111;
      background:#ddd;border:6px solid #f4f4f4;box-shadow:0 10px 24px #0008;
      transform:rotate(var(--r));transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
  .spot:hover,.spot:focus-visible{transform:rotate(0deg) scale(1.06);box-shadow:0 16px 36px #000a;z-index:3;outline:none}
  .spot .ph{position:absolute;inset:0;background:repeating-linear-gradient(-45deg,#cfcfcf 0 10px,#c6c6c6 10px 20px)}
  .spot .lbl{position:absolute;left:0;right:0;bottom:-30px;text-align:center;font-size:13px;color:#eee;letter-spacing:.04em;white-space:nowrap}
  .s1{--r:-7deg;left:6%;top:12%}
  .s2{--r:5deg;left:40%;top:30%}
  .s3{--r:-3deg;left:68%;top:8%}
  @media (prefers-reduced-motion:reduce){ .spot{transition:none} .spot:hover,.spot:focus-visible{transform:rotate(var(--r))} }
  .note{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#777}
  @media (max-width:600px){ .spot{width:31%;border-width:4px} .spot .lbl{font-size:11px;bottom:-24px} .s1{left:3%;top:14%} .s2{left:35%;top:40%} .s3{left:66%;top:6%} }
</style>
</head>
<body>
  <header class="bar"><a class="brand" href="../../">JY YEÜNG</a><span class="tag">everything he wanted</span></header>
  <main>
    <div class="stage">
      <div class="cover"><span>EHW cover (placeholder)</span></div>
      <a class="spot s1" href="#dang" aria-label="Dang"><span class="ph"></span><span class="lbl">Dang</span></a>
      <a class="spot s2" href="#mas" aria-label="Main Antagonist Syndrome"><span class="ph"></span><span class="lbl">Main Antagonist Syndrome</span></a>
      <a class="spot s3" href="#ehw" aria-label="everything he wanted"><span class="ph"></span><span class="lbl">everything he wanted</span></a>
    </div>
  </main>
  <p class="note">v2.0 mock A: placeholders only. Portraits tilt loosely and straighten on hover or tap.</p>
</body>
</html>
