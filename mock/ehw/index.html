<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="icon" href="../../favicon.ico" sizes="any" />
<link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml" />
<title>everything he wanted — landing mock (v2.0 B)</title>
<style>
  @font-face {
    font-family: "Geist";
    font-style: normal;
    font-weight: 900;
    font-display: swap;
    src: url("../../assets/fonts/Geist-Black.woff2") format("woff2");
  }
  @font-face {
    font-family: "Geist";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("../../assets/fonts/Geist.ttf") format("truetype");
  }

  :root {
    --ehw-yellow: #E8CA36;
    --ehw-teal: #356365;
    --ehw-ink: #1a2e2f;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--ehw-yellow);
    color: var(--ehw-ink);
    font-family: Helvetica, Arial, sans-serif;
  }

  .bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    pointer-events: none;
  }
  .bar a, .bar .tag { pointer-events: auto; }
  .brand {
    font-family: "Geist", Helvetica, sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    font-size: 16px;
    letter-spacing: 0;
    color: var(--ehw-teal);
    text-decoration: none;
  }
  .brand:hover, .brand:focus-visible { text-decoration: underline; outline: none; }
  .tag {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ehw-teal);
    opacity: 0.85;
  }

  main {
    min-height: 100dvh;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 12px 28px;
  }

  /* 4:5 stage scales with the smaller viewport axis; page yellow letterboxes */
  .stage {
    position: relative;
    width: min(92vw, calc((100dvh - 84px) * 4 / 5), 720px);
    width: min(92vw, calc((100vh - 84px) * 4 / 5), 720px);
    aspect-ratio: 4 / 5;
    max-height: calc(100dvh - 84px);
    max-height: calc(100vh - 84px);
  }

  .cover {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  /* Mask JY YEÜNG oval on website version (not a clickable component) */
  .oval-mask {
    position: absolute;
    left: 11.2%;
    top: 12.6%;
    width: 29.5%;
    height: 7.2%;
    border-radius: 50%;
    background: var(--ehw-yellow);
    pointer-events: none;
    z-index: 2;
  }

  .hotspot {
    position: absolute;
    z-index: 3;
    margin: 0;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 2px;
    background: transparent;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }
  .hotspot:focus-visible {
    outline: none;
    border-color: var(--ehw-teal);
    box-shadow: 0 0 0 2px var(--ehw-yellow), 0 0 0 4px var(--ehw-teal);
  }
  .hotspot:hover {
    background: rgba(53, 99, 101, 0.08);
  }
  @media (prefers-reduced-motion: reduce) {
    .hotspot { transition: none; }
  }

  /* Portrait hit areas (% of 4:5 cover) */
  .hs-dang { left: 53.4%; top: 4.8%; width: 30.5%; height: 36.2%; }
  .hs-mas  { left: 10.0%; top: 30.2%; width: 33.6%; height: 40.2%; }
  .hs-ehw  { left: 57.2%; top: 62.8%; width: 35.6%; height: 33.0%; }
  .hs-title{ left: 56.5%; top: 43.5%; width: 35.0%; height: 18.5%; }

  .note {
    position: fixed;
    left: 0; right: 0; bottom: 8px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ehw-teal);
    opacity: 0.7;
    pointer-events: none;
    z-index: 5;
  }

  /* Modal */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(26, 46, 47, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .backdrop.open {
    opacity: 1;
    visibility: visible;
  }
  @media (prefers-reduced-motion: reduce) {
    .backdrop { transition: none; }
  }

  .modal {
    position: relative;
    width: min(92vw, 420px);
    max-height: min(80vh, 560px);
    overflow: auto;
    background: #fff8dc;
    color: var(--ehw-ink);
    border: 3px solid var(--ehw-teal);
    border-radius: 12px;
    padding: 28px 24px 24px;
    box-shadow: 0 18px 48px rgba(0,0,0,0.28);
  }
  .modal h2 {
    margin: 0 36px 12px 0;
    font-family: "Geist", Helvetica, sans-serif;
    font-weight: 900;
    font-size: 1.25rem;
    line-height: 1.2;
    color: var(--ehw-teal);
    text-transform: uppercase;
  }
  .modal.art-desc h2 { text-transform: none; }
  .modal p {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.55;
  }
  .modal .close {
    position: absolute;
    top: 10px; right: 10px;
    width: 36px; height: 36px;
    border: none;
    border-radius: 50%;
    background: var(--ehw-yellow);
    color: var(--ehw-teal);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
  .modal .close:hover,
  .modal .close:focus-visible {
    outline: 2px solid var(--ehw-teal);
    outline-offset: 2px;
  }

  @media (max-width: 520px) {
    .brand { font-size: 14px; }
    .oval-mask { height: 6.8%; top: 12.8%; }
    .modal { padding: 24px 18px 18px; }
  }

  @media (orientation: landscape) and (max-height: 520px) {
    main { padding: 48px 8px 16px; }
    .stage {
      width: min(48vw, calc((100vh - 64px) * 4 / 5));
    }
    .note { display: none; }
  }
</style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="../../">JY YEÜNG</a>
    <span class="tag">everything he wanted · mock B</span>
  </header>

  <main>
    <div class="stage" id="stage">
      <picture>
        <source type="image/webp" srcset="assets/ehw-cover-4x5.webp" />
        <img
          class="cover"
          src="assets/ehw-cover-4x5.jpg"
          width="1080"
          height="1350"
          alt="everything he wanted cover art"
          decoding="async"
          fetchpriority="high"
        />
      </picture>
      <div class="oval-mask" aria-hidden="true" title="JY YEÜNG oval masked for website version"></div>

      <button type="button" class="hotspot hs-dang" data-modal="dang" aria-label="Open Dang"></button>
      <button type="button" class="hotspot hs-mas" data-modal="mas" aria-label="Open Main Antagonist Syndrome"></button>
      <button type="button" class="hotspot hs-ehw" data-modal="ehw" aria-label="Open everything he wanted"></button>
      <button type="button" class="hotspot hs-title" data-modal="art" aria-label="Open art description"></button>
    </div>
  </main>

  <p class="note">v2.0 mock B · cover hotspots · placeholders</p>

  <div class="backdrop" id="backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button type="button" class="close" id="modal-close" aria-label="Close">&times;</button>
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
    </div>
  </div>

<script>
(function () {
  var copy = {
    dang: {
      title: "Dang",
      body: "Placeholder for Dang. Caroline Polachek PowerPoint energy — IG slides and video land here. Body copy TBD."
    },
    mas: {
      title: "Main Antagonist Syndrome",
      body: "Placeholder for Main Antagonist Syndrome. Red editorial mood and the Apple Music playlist embed will sit in this mini window. Body copy TBD."
    },
    ehw: {
      title: "everything he wanted",
      body: "Placeholder for everything he wanted. Younger-self editorial piece. Body copy TBD."
    },
    art: {
      title: "Art description",
      body: "Placeholder art description for the everything he wanted cover. Mustard field, three untidy portraits, stacked title. Full credit and process notes TBD.",
      art: true
    }
  };

  var backdrop = document.getElementById("backdrop");
  var modal = document.getElementById("modal");
  var titleEl = document.getElementById("modal-title");
  var bodyEl = document.getElementById("modal-body");
  var closeBtn = document.getElementById("modal-close");
  var lastFocus = null;

  function openModal(key) {
    var item = copy[key];
    if (!item) return;
    lastFocus = document.activeElement;
    titleEl.textContent = item.title;
    bodyEl.textContent = item.body;
    modal.classList.toggle("art-desc", !!item.art);
    backdrop.hidden = false;
    // force reflow for transition
    void backdrop.offsetWidth;
    backdrop.classList.add("open");
    closeBtn.focus();
  }

  function closeModal() {
    backdrop.classList.remove("open");
    var done = function () {
      backdrop.hidden = true;
      backdrop.removeEventListener("transitionend", done);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    };
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      done();
    } else {
      backdrop.addEventListener("transitionend", done);
      setTimeout(done, 250);
    }
  }

  document.querySelectorAll(".hotspot").forEach(function (btn) {
    btn.addEventListener("click", function () {
      openModal(btn.getAttribute("data-modal"));
    });
  });

  closeBtn.addEventListener("click", closeModal);
  backdrop.addEventListener("click", function (e) {
    if (e.target === backdrop) closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && backdrop.classList.contains("open")) {
      e.preventDefault();
      closeModal();
    }
  });
})();
</script>
</body>
</html>
